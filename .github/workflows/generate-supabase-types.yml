name: Generate Supabase TypeScript Types

on:
  # Allows manual execution from the Actions tab anytime you update your schema in Supabase
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message'
        required: false
        default: 'chore(supabase): update database types'
  # Scheduled run daily at 00:00 UTC to catch any dashboard updates
  schedule:
    - cron: '0 0 * * *'

# Required permissions to commit changes back to the repository
permissions:
  contents: write

jobs:
  update-types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate TypeScript types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || secrets.PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Error: SUPABASE_ACCESS_TOKEN secret is not set."
            exit 1
          fi

          if [ -z "$PROJECT_ID" ]; then
            echo "Error: SUPABASE_PROJECT_ID (or PROJECT_REF) secret is not set."
            exit 1
          fi

          mkdir -p src/types
          supabase gen types typescript --project-id "$PROJECT_ID" > src/types/database.types.ts
          echo "Successfully generated src/types/database.types.ts"

      - name: Commit and push changes
        env:
          COMMIT_MSG: ${{ github.event.inputs.commit_message || 'chore(supabase): auto-update database types [skip ci]' }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/types/database.types.ts

          if ! git diff --staged --quiet; then
            echo "Changes detected in database.types.ts. Committing..."
            git commit -m "$COMMIT_MSG"
            git push
            echo "Pushed updated types to repository."
          else
            echo "No changes detected in database schema."
          fi
